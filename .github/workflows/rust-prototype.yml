name: Rust desktop preview
on:
  pull_request:
    paths: ['rust/**', 'installer/**', 'tests/data/**', '.github/workflows/rust-prototype.yml']
  workflow_dispatch:

permissions:
  contents: read
jobs:
  preview:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
            bundles: app,dmg
          - os: ubuntu-24.04
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust
    env:
      CARGO_INCREMENTAL: '0'
      APPIMAGE_EXTRACT_AND_RUN: '1'
      INNO_VERSION: '6.7.3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.94.1'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf libfuse2t64 tesseract-ocr tesseract-ocr-chi-sim xvfb dbus-x11 xdotool python3-gi gir1.2-gtk-3.0
          dpkg-query -W -f='${Package} ${Installed-Size} KiB\n' tesseract-ocr tesseract-ocr-chi-sim tesseract-ocr-eng libwebkit2gtk-4.1-0 libayatana-appindicator3-1
      - run: npm ci
      - run: npm run check
      - name: Frontend unit tests (calendar keyboard, field filters)
        run: npm test
      - run: npm run build
      - run: cargo fmt --all --check
      - run: cargo clippy --release --workspace --all-targets --locked -- -D warnings
      - name: Rust core (old CTest fixtures, migration) and shell tests
        run: cargo test --release --workspace --locked
      - if: runner.os != 'Windows'
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}
      - if: runner.os == 'Windows'
        run: npm run tauri build -- --no-bundle
      - if: runner.os == 'Windows'
        name: Build the Inno installer around the Rust EXE (same AppId)
        shell: pwsh
        run: |
          $iscc = @("$env:ProgramFiles\Inno Setup 6\ISCC.exe", "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --version=$env:INNO_VERSION -y --no-progress
            $iscc = @("$env:ProgramFiles\Inno Setup 6\ISCC.exe", "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $numeric = ($version -split '-')[0]
          $exe = (Resolve-Path target/release/offwork.exe).Path
          $out = Join-Path (Get-Location) target/installer
          # Microsoft's Evergreen WebView2 bootstrapper, bundled so the installer
          # can add the runtime before replacing 0.4.x. Must be Microsoft-signed.
          $bootstrapper = Join-Path (Get-Location) target/MicrosoftEdgeWebview2Setup.exe
          Invoke-WebRequest "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile $bootstrapper
          $sig = Get-AuthenticodeSignature $bootstrapper
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') { throw "Unexpected WebView2 bootstrapper signature: $($sig.Status) $($sig.SignerCertificate.Subject)" }
          & $iscc "/DAppVersion=$version" "/DNumericVersion=$numeric" "/DSourceExe=$exe" "/DOutputPath=$out" "/DWebView2Bootstrapper=$bootstrapper" ..\installer\offwork.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }
      - if: runner.os == 'Linux'
        name: Real GTK drag-and-drop into the release widget under Xvfb
        run: dbus-run-session -- xvfb-run -a /usr/bin/python3 scripts/x11_drop.py
      - run: python scripts/package_report.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: runner.os == 'Windows'
        name: Install 0.4.5, upgrade to the Rust build, migrate, reinstall, uninstall
        run: python scripts/windows_smoke.py artifacts/OffWork-Setup.exe
      - name: Calendar popup opens and closes without blocking the main loop
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) dbus-run-session -- xvfb-run -a python scripts/calendar_smoke.py target/release/offwork ;;
            Windows) python scripts/calendar_smoke.py target/release/offwork.exe ;;
            macOS) python scripts/calendar_smoke.py target/release/bundle/macos/OffWork.app/Contents/MacOS/offwork ;;
          esac
      - name: Hidden-window five-minute reminder fires once, on time
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) dbus-run-session -- xvfb-run -a python scripts/reminder_smoke.py target/release/offwork ;;
            Windows) python scripts/reminder_smoke.py target/release/offwork.exe ;;
            macOS) python scripts/reminder_smoke.py target/release/bundle/macos/OffWork.app/Contents/MacOS/offwork ;;
          esac
      - run: python -m pip install psutil==7.2.2
      # Memory gate: 2 min visible, then 10 min hidden; fails if the hidden
      # process-tree working set grows by more than 16 MiB (first vs last minute).
      - if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a python scripts/measure.py target/release/offwork artifacts/runtime.json --visible-seconds 120 --hidden-seconds 600 --max-hidden-growth-mib 16
      - if: runner.os == 'Windows'
        run: python scripts/measure.py target/release/offwork.exe artifacts/runtime.json --visible-seconds 120 --hidden-seconds 600 --max-hidden-growth-mib 16
      - if: runner.os == 'macOS'
        run: |
          test "$(uname -m)" = arm64
          python scripts/measure.py target/release/bundle/macos/OffWork.app/Contents/MacOS/offwork artifacts/runtime.json --visible-seconds 120 --hidden-seconds 600 --max-hidden-growth-mib 16
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OffWork-preview-${{ runner.os }}-${{ runner.arch }}
          path: rust/artifacts
