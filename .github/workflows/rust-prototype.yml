name: Rust desktop prototype
on:
  pull_request:
    paths: ['rust/**', '.github/workflows/rust-prototype.yml']
  workflow_dispatch:

permissions:
  contents: read
jobs:
  prototype:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: macos-latest
            bundles: app,dmg
          - os: ubuntu-24.04
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust
    env:
      CARGO_INCREMENTAL: '0'
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.94.1'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2t64 tesseract-ocr tesseract-ocr-chi-sim xvfb dbus-x11 xdotool python3-gi gir1.2-gtk-3.0
          dpkg-query -W -f='${Package} ${Installed-Size} KiB\n' tesseract-ocr tesseract-ocr-chi-sim tesseract-ocr-eng libwebkit2gtk-4.1-0 libayatana-appindicator3-1
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: cargo fmt --all --check
      - run: cargo clippy --release --workspace --all-targets --locked -- -D warnings
      - run: cargo test --release --workspace --locked
      - run: npm run tauri build -- --bundles ${{ matrix.bundles }}
      - if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a /usr/bin/python3 scripts/x11_drop.py
      - run: python scripts/package_report.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install psutil==7.2.2
      - if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a python scripts/measure.py target/release/offwork artifacts/runtime.json --seconds 30
      - if: runner.os == 'Windows'
        run: python scripts/measure.py target/release/offwork.exe artifacts/runtime.json --seconds 30
      - if: runner.os == 'Windows'
        name: Compare the existing native widget on the same runner
        run: |
          cmake -S .. -B target/legacy -A x64
          cmake --build target/legacy --config Release --target OffWork --parallel
          python scripts/measure.py target/legacy/Release/OffWork.exe artifacts/legacy-runtime.json --legacy-windows --seconds 30
          $runtime = Get-ChildItem "${env:ProgramFiles(x86)}/Microsoft/EdgeWebView/Application" -Directory | Where-Object Name -Match '^\d' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($runtime) {
            $bytes = (Get-ChildItem $runtime.FullName -Recurse -File | Measure-Object Length -Sum).Sum
            "WebView2 $($runtime.Name) $bytes bytes" | Tee-Object artifacts/host-runtime.txt
          }
      - if: runner.os == 'macOS'
        run: |
          test "$(uname -m)" = arm64
          python scripts/measure.py target/release/bundle/macos/OffWork.app/Contents/MacOS/offwork artifacts/runtime.json --seconds 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OffWork-prototype-${{ runner.os }}-${{ runner.arch }}
          path: rust/artifacts
