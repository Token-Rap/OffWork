[package]
name="offwork"
version="0.5.0-preview.1"
edition="2021"
build="build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri= {version="2",features= ["tray-icon", "macos-private-api"] }
tauri-plugin-single-instance="2"
tauri-plugin-notification="2"
serde= {version="1",features= ["derive"] }
serde_json="1"
chrono="0.4"
offwork-core= {path="../core"}
tempfile="3"
sha2="0.10"
ureq= {version="2.12",default-features=false,features= ["native-tls"] }
native-tls="0.2"

[target.'cfg(windows)'.dependencies]
dunce = "1"
windows= {version="0.61",features= ["Foundation", "Foundation_Collections", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage", "Storage_Streams", "Win32_System_WinRT"] }
